<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Airline — mockup v6 (telefon)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script>/* gdy karta jest zasłonięta, przeglądarka dławi animację; zapasowy zegar utrzymuje ruch */
(()=>{const n=window.requestAnimationFrame.bind(window);window.requestAnimationFrame=cb=>{let d=0;const run=t=>{if(d)return;d=1;cb(t);};n(run);setTimeout(()=>run(performance.now()),48);return 0;};})();</script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--f:"Instrument Sans",-apple-system,"Segoe UI",Roboto,sans-serif;--brand:#e0492f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#0c0e13}
body{font:400 15px/1.4 var(--f);display:grid;place-items:center}
.phone{position:relative;width:390px;height:min(844px,calc(100vh - 24px));overflow:hidden;border-radius:44px;background:#0b1326;
  box-shadow:0 0 0 10px #1a1c22,0 0 0 11px #33363f,0 40px 90px #000c;color:var(--txt);
  --glass:rgba(255,255,255,.84);--solid:#fff;--txt:#14161a;--sub:#6a7079;--line:rgba(20,22,26,.1);--soft:rgba(20,22,26,.05);--pos:#12804a;--neg:#cf3a25;--blue:#2a5bd7;
  transition:color .8s}
.phone[data-tod=night]{--glass:rgba(20,24,34,.78);--solid:#1a1f2b;--txt:#f1f3f7;--sub:#9099a8;--line:rgba(255,255,255,.13);--soft:rgba(255,255,255,.06);--pos:#4fd08b;--neg:#ff7a63;--blue:#7fa6ff}
#map,#lights{position:absolute;inset:0}
#lights{pointer-events:none;mix-blend-mode:screen}
.maplibregl-ctrl-attrib{font:9px var(--f);background:transparent!important;opacity:.55}
.maplibregl-ctrl-bottom-right{bottom:auto;top:92px}
button{font-family:var(--f);color:inherit}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* --- góra --- */
.hud{position:absolute;left:14px;right:14px;top:16px;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.pill{appearance:none;margin:0;text-align:left;font:inherit;pointer-events:auto;cursor:pointer;border-radius:22px;display:flex;align-items:center;gap:10px;padding:8px 16px 8px 9px}
.pill .tail{width:36px;height:36px;border-radius:50%;background:var(--brand);display:grid;place-items:center;flex:none;transition:background .4s}
.pill .tail svg{width:20px;height:20px}
.cash{font:700 19px/1.1 var(--f);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.delta{font:500 12px/1.2 var(--f);color:var(--sub)}
.timep{padding:8px 13px 8px 11px;gap:8px}
.timep svg{width:22px;height:22px;flex:none}
.timep .t{font:700 17px/1 var(--f);font-variant-numeric:tabular-nums}
.timep .sp{font:600 12px/1 var(--f);color:var(--sub);min-width:18px;text-align:right}

/* --- lotniska --- */
.ap{width:0;height:0;position:relative;cursor:pointer}
.ap .ring{position:absolute;left:0;top:0;transform:translate(-50%,-50%);border-radius:50%;background:rgba(130,136,148,.22);border:1px solid rgba(130,136,148,.7);display:none}
.ap .core{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;background:#fff;border:1.5px solid #2a2e37;transition:width .3s,height .3s}
.ap.served .core{width:11px;height:11px;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.ap.base .core{width:16px;height:16px;background:#fff;border:4.5px solid var(--brand);box-shadow:0 0 0 1.5px #fff,0 2px 8px rgba(0,0,0,.4)}
.ap.sel .core{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--brand)}
.ap .lbl{position:absolute;left:0;transform:translateX(-50%);white-space:nowrap;border-radius:8px;font:600 11.5px/1 var(--f);padding:4px 6px;display:flex;gap:5px;
  color:var(--txt);background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-variant-numeric:tabular-nums}
.ap .lbl em{font-style:normal;color:var(--blue)} .ap .lbl em.pos{color:var(--pos)} .ap .lbl em.neg{color:var(--neg)} .ap .lbl em:empty{display:none}
.ap.base .lbl{background:var(--brand);border-color:transparent;color:#fff;font-weight:700}
.demand .ap:not(.base) .ring{display:block}
.demand .ap:not(.base) .core{background:var(--blue);border:1.5px solid #fff;box-shadow:none}
.ap .lbl em.br{color:var(--brand)}
.ap.offer .core{box-shadow:0 0 0 3px var(--brand)}
.ap.offer::after{content:"Oferta";position:absolute;left:0;bottom:11px;transform:translateX(-50%);background:var(--brand);color:#fff;font:700 10.5px/1 var(--f);padding:4px 7px;border-radius:9px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.offerbox{border-radius:18px;border:1.5px solid var(--brand);padding:12px 14px 14px;margin-bottom:12px;font:400 14.5px/1.4 var(--f)}
.offerbox .t{display:block;font:700 15px/1.2 var(--f);margin-bottom:4px;color:var(--brand)}
.grabz{flex:none;padding-bottom:6px;touch-action:none;cursor:grab}
.apview .ap,.apview .fx{display:none}
.apgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.apgrid div{border-radius:12px;background:var(--soft);padding:7px 10px;font:500 12.5px/1.3 var(--f)}
.apgrid b{font-weight:700}
.apgrid span{display:block;color:var(--sub);font-size:11.5px}
.ap.base2 .core{width:14px;height:14px;background:#fff;border:4px solid var(--brand);box-shadow:0 0 0 1.5px #fff}
.box{border-radius:18px;background:var(--soft);padding:12px 14px 14px;margin:12px 0;font:400 14.5px/1.4 var(--f)}
.box .t{display:block;font:700 15px/1.2 var(--f);margin-bottom:4px}
.go[disabled]{opacity:.38;pointer-events:none}
.intro{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;padding:0 24px 34px;color:#fff;
  background:linear-gradient(180deg,rgba(5,9,20,0) 32%,rgba(5,9,20,.86) 80%);transition:opacity .6s}
.intro.off{opacity:0;pointer-events:none}
.intro small{font:600 12px var(--f);letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.intro h1{font:700 56px/1 var(--f);letter-spacing:-.03em;margin:6px 0 10px}
.intro p{font:400 17px/1.42 var(--f);margin:0 0 20px;opacity:.92;max-width:310px}
.intro .go{margin-top:10px}
.intro .go.sec{background:rgba(255,255,255,.15);color:#fff}
.pickbar{position:absolute;left:14px;right:14px;top:16px;z-index:9;border-radius:20px;padding:13px 16px;font:600 15px/1.3 var(--f);text-align:center;display:none}
.picking .pickbar{display:block}
.pre .hud,.pre .dock,.pre .toast{visibility:hidden}
.pre:not(.picking) .ap{display:none}
.field{width:100%;border:1.5px solid var(--line);background:var(--soft);color:var(--txt);border-radius:16px;padding:14px 16px;font:600 18px var(--f);outline:none;margin-bottom:12px}
.field:focus{border-color:var(--brand)}
.fx{width:0;height:0;position:relative;pointer-events:none}
.fx i{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid var(--brand);animation:ring 1.4s ease-out forwards}
.fx.big i{border-width:3px;animation-duration:2.4s}
.fx b{position:absolute;left:0;bottom:10px;transform:translateX(-50%);white-space:nowrap;font:700 12.5px/1 var(--f);color:#fff;background:var(--pos);padding:4px 7px;border-radius:9px;animation:rise 2s ease-out forwards}
@keyframes ring{from{transform:scale(1);opacity:1}to{transform:scale(6);opacity:0}}
@keyframes rise{from{transform:translate(-50%,6px);opacity:0}14%{opacity:1}75%{opacity:1}to{transform:translate(-50%,-34px);opacity:0}}

/* --- dolny pasek narzędzi --- */
.dock{position:absolute;left:50%;bottom:18px;z-index:6;transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:26px}
.dock.hide{transform:translate(-50%,130%)}
.dock button{all:unset;cursor:pointer;width:66px;padding:7px 0 6px;border-radius:20px;display:grid;justify-items:center;gap:3px;font:600 11px/1 var(--f);color:var(--sub);transition:background .2s,color .2s}
.dock svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dock button.on{background:var(--brand);color:#fff}
.dock button:active{background:var(--soft)}

/* --- arkusz --- */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;border-radius:30px 30px 0 0;max-height:66%;display:flex;flex-direction:column;
  transform:translateY(105%)}
.sheet.open{transform:none}
.sheet.tall{max-height:88%;height:88%}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px;flex:none}
.body{overflow:auto;padding:6px 20px 22px;-webkit-overflow-scrolling:touch}
.hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.hd h2{font:700 27px/1.05 var(--f);letter-spacing:-.02em;margin:0}
.hd p{margin:4px 0 0;font:500 13px/1.3 var(--f);color:var(--sub)}
.x{all:unset;cursor:pointer;margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.x svg{width:13px;height:13px;stroke:var(--sub);stroke-width:2.2;stroke-linecap:round}
.prog{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.prog b{display:block;font:700 15px/1 var(--f)} .prog span{font:500 12px/1.3 var(--f);color:var(--sub);font-variant-numeric:tabular-nums}
.prog .r{text-align:right}
.tr{position:relative;height:24px}
.tr::before{content:"";position:absolute;left:0;right:0;top:11px;height:2px;border-radius:1px;background:var(--line)}
.tr i{position:absolute;left:0;top:11px;height:2px;border-radius:1px;background:var(--brand)}
.tr svg{position:absolute;top:1px;width:22px;height:22px;margin-left:-11px;transform:rotate(90deg);fill:var(--brand)}
.status{font:500 13px/1.3 var(--f);color:var(--sub);margin:4px 0 12px;text-align:center}
.ac{border-radius:18px;background:var(--soft);padding:4px 14px 4px 6px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ac svg{width:168px;height:auto;display:block;flex:none}
.ac .n{font:600 14px/1.2 var(--f)} .ac .s{font:500 12.5px/1.3 var(--f);color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats div{border-radius:16px;background:var(--soft);padding:11px 12px 10px}
.stats b{display:block;font:700 23px/1 var(--f);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats span{font:500 11.5px/1.25 var(--f);color:var(--sub);display:block;margin-top:5px}
.note{margin:0 0 12px;font:400 14.5px/1.42 var(--f)}
.note b{font-weight:700}
.step{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.step label{flex:1;font:500 15px var(--f)}
.step button{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font:500 22px/1 var(--f)}
.step button:active{background:var(--brand);color:#fff}
.step output{font:700 18px var(--f);min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
.go{all:unset;cursor:pointer;display:block;box-sizing:border-box;width:100%;text-align:center;background:var(--brand);color:#fff;font:700 16px/1 var(--f);padding:16px 12px;border-radius:18px;margin-top:6px;transition:transform .12s,background .4s}
.go:active{transform:scale(.97)}
.go.sec{background:var(--soft);color:var(--txt)}
.alt{all:unset;cursor:pointer;display:block;text-align:center;font:500 13.5px var(--f);color:var(--sub);padding:12px 0 0;width:100%}
.rowl{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.rowl:first-of-type{border-top:0}
.rowl .c{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font:700 12.5px var(--f);flex:none}
.rowl .m{flex:1;min-width:0} .rowl .m b{display:block;font:600 15.5px/1.2 var(--f)} .rowl .m span{font:500 12.5px/1.3 var(--f);color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowl .v{font:700 15.5px var(--f);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:3px;margin-bottom:12px}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;font:600 14px/1 var(--f);padding:10px 0;border-radius:11px;color:var(--sub)}
.seg button.on{background:var(--solid);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.liv{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:500 13.5px var(--f);color:var(--sub)}
.liv button{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;box-shadow:0 0 0 2px var(--solid),0 0 0 3px var(--line)}
.liv button.on{box-shadow:0 0 0 2px var(--solid),0 0 0 4.5px var(--txt)}
.plane-card{border-radius:22px;background:var(--soft);padding:6px 16px 14px;margin-bottom:12px}
.plane-card svg{width:100%;height:auto;display:block}
.plane-card .mk{font:600 11.5px/1 var(--f);letter-spacing:.07em;text-transform:uppercase;color:var(--sub)}
.plane-card .n{font:700 21px/1.15 var(--f);letter-spacing:-.01em}
.plane-card .s{font:500 13px/1.35 var(--f);color:var(--sub)}
.spec{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;margin:10px 0 12px}
.spec div b{display:block;font:700 15.5px/1.1 var(--f);font-variant-numeric:tabular-nums} .spec div span{font:500 11px/1.3 var(--f);color:var(--sub)}
.sum{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font:500 15px var(--f)}
.sum b{font-weight:700;font-variant-numeric:tabular-nums}
.sum.t{font-size:17px;border-top:1.5px solid var(--txt)}
.fine{font:400 12px/1.4 var(--f);color:var(--sub);margin:10px 0 0}

.toast{position:absolute;left:14px;right:14px;top:76px;z-index:7;border-radius:18px;padding:11px 15px;font:500 14px/1.35 var(--f);
  transform:translateY(-12px);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.2,.9,.3,1.2),opacity .3s,background .8s}
.toast.glass{transition:transform .4s cubic-bezier(.2,.9,.3,1.2),opacity .3s,background .8s}
.toast.on{transform:none;opacity:1}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--line);
  box-shadow:0 8px 28px rgba(0,0,0,.14);transition:background .8s,border-color .8s,transform .42s cubic-bezier(.2,.85,.25,1)}
@media (max-width:480px){body{display:block}.phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div class="phone pre" id="phone" data-tod="night">
  <div id="map"></div>
  <div id="lights"></div>

  <div class="hud">
    <button class="pill glass" id="bFin">
      <span class="tail"><svg viewBox="0 0 20 20"><path d="M3.5 17 9.5 3h6L13 17z" fill="#fff"/></svg></span>
      <span><span class="cash" id="cash"></span><br><span class="delta" id="weekly"></span></span>
    </button>
    <button class="pill glass timep" id="bTime">
      <svg viewBox="0 0 22 22" id="sky"></svg><span class="t" id="time"></span><span class="sp" id="sp">1×</span>
    </button>
  </div>
  <div class="toast glass" id="toast"></div>
  <div class="pickbar glass">Wybierz lotnisko, z którego zaczniesz</div>
  <div class="intro" id="intro">
    <small>Nazwa robocza</small><h1>Airline</h1>
    <p>Załóż linię lotniczą na prawdziwej mapie. Światła pokazują, gdzie naprawdę mieszkają ludzie.</p>
    <button class="go" id="iNew">Nowa linia</button>
    <button class="go sec" id="iDemo">Zobacz przykład: Silesia Air</button>
  </div>

  <nav class="dock glass" id="dock">
    <button data-a="routes"><svg viewBox="0 0 24 24"><circle cx="5" cy="18" r="2.2"/><circle cx="19" cy="6" r="2.2"/><path d="M7 17c8-.5 3-10 10-10.5"/></svg>Trasy</button>
    <button data-a="fleet"><svg viewBox="0 0 24 24"><path d="M12 2.5c.8 0 1.4 1 1.4 2.4v4.6l7.6 4.4v1.9l-7.6-2.2v4.8l2.2 1.6v1.5L12 20.6l-3.6.9V20l2.2-1.6v-4.8L3 15.8v-1.9l7.6-4.4V4.9c0-1.4.6-2.4 1.4-2.4z"/></svg>Flota</button>
    <button data-a="demand"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8.5" stroke-dasharray="2.5 3"/></svg>Popyt</button>
    <button data-a="brand"><svg viewBox="0 0 24 24"><path d="M4 10v4l3 .6V9.4zM7 9.4 17 5v14L7 14.6M17 9.2a3 3 0 0 1 0 5.6M9.6 15.8l1 3.7"/></svg>Marka</button>
    <button data-a="fin"><svg viewBox="0 0 24 24"><path d="M4 19V11M10 19V5M16 19v-6M21.5 19h-19"/></svg>Finanse</button>
  </nav>

  <section class="sheet glass" id="sheet"><div class="grabz" id="grabz"><div class="grab"></div></div><div class="body" id="body"></div></section>
</div>

<script>
// ================= DANE POGLĄDOWE =================
const AP=[
 ['KTW','Katowice',19.080,50.474,4.6,0,1,'','Katowic'],['WAW','Warszawa',20.967,52.166,3.4,.8,1,'pociąg (2 h 20)','Warszawy'],
 ['KRK','Kraków',19.785,50.078,2.6,.995,1,'samochód (godzina drogi)','Krakowa'],['GDN','Gdańsk',18.466,54.378,1.6,.25,1,'pociąg','Gdańska'],
 ['WRO','Wrocław',16.886,51.103,1.9,.65,1,'samochód lub pociąg','Wrocławia'],['POZ','Poznań',16.826,52.421,1.7,.5,1,'pociąg lub samochód','Poznania'],
 ['RZE','Rzeszów',22.019,50.110,1.1,.6,1,'samochód','Rzeszowa'],['LTN','Londyn',-0.368,51.875,12,0,1,'','Londynu'],
 ['CDG','Paryż',2.55,49.01,12,0,1,'','Paryża'],['FRA','Frankfurt',8.570,50.033,6.5,0,1,'','Frankfurtu'],
 ['MUC','Monachium',11.786,48.354,4.5,.1,1,'samochód','Monachium'],['BER','Berlin',13.503,52.362,5,.3,1,'pociąg lub samochód','Berlina'],
 ['DTM','Dortmund',7.612,51.518,9,0,1,'','Dortmundu'],['BGY','Bergamo',9.704,45.674,8,0,1,'','Bergamo'],
 ['FCO','Rzym',12.239,41.8,4.5,0,1.3,'','Rzymu'],['BCN','Barcelona',2.078,41.297,5,0,1.5,'','Barcelony'],
 ['ATH','Ateny',23.944,37.936,3.8,0,1.4,'','Aten'],['OSL','Oslo',11.1,60.194,1.8,0,1.6,'','Oslo'],
 ['ARN','Sztokholm',17.919,59.652,2.4,0,1,'','Sztokholmu'],['CPH','Kopenhaga',12.656,55.618,3,0,1,'','Kopenhagi'],
 ['AMS','Amsterdam',4.764,52.309,8,0,1,'','Amsterdamu'],['VIE','Wiedeń',16.570,48.110,3.5,.4,1,'samochód lub pociąg','Wiednia'],
 ['PRG','Praga',14.260,50.101,2.6,.45,1,'samochód','Pragi'],['BUD','Budapeszt',19.256,47.437,3,.35,1,'samochód','Budapesztu'],
 ['SPU','Split',16.298,43.539,0.5,0,3,'','Splitu'],['BOJ','Burgas',27.515,42.570,0.4,0,3,'','Burgas'],
 ['IST','Stambuł',28.751,41.275,15,0,1,'','Stambułu'],['MAD','Madryt',-3.567,40.472,6.5,0,1,'','Madrytu'],
 ['LIS','Lizbona',-9.136,38.774,3,0,1.5,'','Lizbony'],['DUB','Dublin',-6.270,53.421,2,0,1,'','Dublina']
].map(a=>({code:a[0],name:a[1],ll:[a[2],a[3]],catch:a[4],land:a[5],tour:a[6],by:a[7],gen:a[8]}));
const by=Object.fromEntries(AP.map(a=>[a.code,a]));let BASE=by.KTW, AIRNAME='Silesia Air', picking=false;

const R=6371, rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;

function arc(a,b,n=96){const φ1=rad(a[1]),λ1=rad(a[0]),φ2=rad(b[1]),λ2=rad(b[0]),d=dist(a,b)/R,out=[];
  for(let i=0;i<=n;i++){const f=i/n,A=Math.sin((1-f)*d)/Math.sin(d),B=Math.sin(f*d)/Math.sin(d);
  const x=A*Math.cos(φ1)*Math.cos(λ1)+B*Math.cos(φ2)*Math.cos(λ2),y=A*Math.cos(φ1)*Math.sin(λ1)+B*Math.cos(φ2)*Math.sin(λ2),z=A*Math.sin(φ1)+B*Math.sin(φ2);
  out.push([deg(Math.atan2(y,x)),deg(Math.atan2(z,Math.sqrt(x*x+y*y)))]);}return out;}

  if(offer.accepted&&to===offer.code){rev+=2*pax*offer.sub*7;cost*=.8;}
  return {a,d,natural,air,p0,price,want,cap,pax,lf:pax/cap,rev,cost,profit:rev-cost,unmet:Math.max(0,want-cap)};}

  const top=AP.filter(x=>x.code!==code).map(x=>({x,c:calc(x.code,1,1,TYPES.AT76)})).filter(o=>o.c.d<=TYPES.AT76.range).sort((m,n)=>n.c.air-m.c.air).slice(0,4);
  const verdict=pax>=25?['Trudny start','Wielki port: wysokie opłaty, mało wolnych terminów i silni rywale.']:pax>=8?['Wymagający start','Spore lotnisko. Ludzi dużo, ale konkurencja już tu jest.']:['Dobry start','Tanie lotnisko i dużo wolnego pola.'];
  openSheet(`<div class="hd"><div><h2>${a.name}</h2><p>${a.code} · ${a.catch.toLocaleString('pl-PL')} mln ludzi w 90 minut dojazdu</p></div>${X}</div>
    <div class="stats"><div><b>${String(pax).replace('.',',')}</b><span>mln pasażerów rocznie</span></div><div><b>${num(rwy)} m</b><span>najdłuższy pas</span></div><div><b>${riv.length}</b><span>${riv.length===1?'rywal na miejscu':'rywali na miejscu'}</span></div></div>
    <div class="box" style="margin-top:0"><span class="t">${verdict[0]}</span>${verdict[1]}${riv.length?' Latają stąd: '+riv.join(', ')+'.':''}</div>
    <p class="note" style="margin-bottom:4px"><b>Dokąd ludzie chcą stąd latać</b> (w zasięgu pierwszego samolotu):</p>
    ${top.map(o=>`<div class="sum"><span>${o.x.name}</span><b>${num(o.c.air)} dziennie</b></div>`).join('')}
    <button class="go" id="pStart" style="margin-top:14px">Zacznij tutaj</button>`);
  q('#pStart').onclick=()=>nameCard(code);mapState();
  requestAnimationFrame(()=>map.easeTo({center:a.ll,zoom:4.4,offset:[0,-sheet.offsetHeight/2+50],duration:800}));}
function nameCard(code){const a=by[code];AIRNAME=code==='KTW'?'Silesia Air':a.name+' Air';
  openSheet(`<div class="hd"><div><h2>Twoja linia</h2><p>Baza: ${a.name} (${a.code})</p></div>${X}</div>
    <input class="field" id="nm" maxlength="18" value="${AIRNAME}" aria-label="Nazwa linii">
    <div class="liv">Malowanie ${LIVS.map(l=>`<button title="${l[0]}" data-c="${l[1]}" style="background:${l[1]}" class="${l[1]===brand?'on':''}"></button>`).join('')}</div>
    <div class="plane-card" id="prev">${sil('AT76')}<div class="n">ATR 72-600</div><div class="s">Twój pierwszy samolot: 72 miejsca, zasięg 1400 km, w leasingu.</div></div>
    <p class="note">Na start dostajesz też <b>3 mln zł</b>. Reszta zależy od tego, dokąd polecisz.</p>
    <button class="go" id="pGo">Startuj</button>`);
  const redraw=()=>{q('#prev svg').outerHTML=sil('AT76');};
  q('#nm').oninput=e=>{AIRNAME=e.target.value.trim()||'Linia';redraw();};
  body.querySelectorAll('.liv button').forEach(b=>b.onclick=()=>{recolor(b.dataset.c);body.querySelectorAll('.liv button').forEach(x=>x.classList.toggle('on',x===b));});
  q('#pGo').onclick=()=>newGame(code);}
function newGame(code){picking=false;BASE=by[code];for(const k in ARC)delete ARC[k];bases.clear();bases.add(code);
  fleet=[{reg:regFor(0),type:'AT76',to:null}];routes=[];deliveries=[];cash=3000000;shown=cash;
  for(const a of AP)aw[a.code]=a.code===code?1:dist(BASE.ll,a.ll)<450?.55:.15;
  offer.shown=false;offer.accepted=false;offer.code=AP.filter(a=>a.code!==code&&INFO[a.code][1]<6).sort((x,y)=>dist(BASE.ll,x.ll)-dist(BASE.ll,y.ll))[0].code;
  buildFlights();sheet.classList.remove('open');dock.classList.remove('hide');sel=null;view=null;beginPlay();
  demand=true;brandMode=false;phone.classList.add('demand');dock.querySelector('[data-a=demand]').classList.add('on');mapState();overview(1500);
  toast(`${AIRNAME} startuje z ${BASE.gen}. Koła pokazują, dokąd ludzie chcą latać. Dotknij lotniska, żeby otworzyć pierwszą trasę.`);}
document.getElementById('sky').innerHTML=MOON;mapState();
</script>
